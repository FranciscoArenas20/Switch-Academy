[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Public browser configuration intentionally included in Next.js bundles.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET"

[[plugins]]
  package = "@netlify/plugin-nextjs"
